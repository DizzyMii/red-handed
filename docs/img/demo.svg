.l11{animation:l11 20s linear infinite}@keyframes l11{0%,38.35%{opacity:0;transform:translateY(3px)}39.25%,91%{opacity:1;transform:none}94%,100%{opacity:0;transform:none}}
.l12{animation:l12 20s linear infinite}@keyframes l12{0%,39.45%{opacity:0;transform:translateY(3px)}40.35%,91%{opacity:1;transform:none}94%,100%{opacity:0;transform:none}}
.l13{animation:l13 20s linear infinite}@keyframes l13{0%,40.55%{opacity:0;transform:translateY(3px)}41.45%,91%{opacity:1;transform:none}94%,100%{opacity:0;transform:none}}
.l14{animation:l14 20s linear infinite}@keyframes l14{0%,43.3%{opacity:0;transform:translateY(3px)}44.2%,91%{opacity:1;transform:none}94%,100%{opacity:0;transform:none}}
.l15{animation:l15 20s linear infinite}@keyframes l15{0%,44.4%{opacity:0;transform:translateY(3px)}45.3%,91%{opacity:1;transform:none}94%,100%{opacity:0;transform:none}}
.l16{animation:l16 20s linear infinite}@keyframes l16{0%,45.5%{opacity:0;transform:translateY(3px)}46.4%,91%{opacity:1;transform:none}94%,100%{opacity:0;transform:none}}
