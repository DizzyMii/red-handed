<rect width="1190" height="792" rx="6" fill="#141412"/>
<path d="M6 0h1178a6 6 0 0 1 6 6v34H0V6A6 6 0 0 1 6 0z" fill="#1b1b18"/>
<path d="M0 40.5h1190" stroke="#3a3934"/>
<rect x=".5" y=".5" width="1189" height="791" rx="6" fill="none" stroke="#3a3934"/>
<g transform="translate(20 12)"><rect width="16" height="16" rx="3.5" fill="#f3f0e8"/><path fill="#141414" d="M4 3H7V13H4Z"/><path fill="#cc1a0a" d="M7 5C7.4 3.7 8.3 3 9.8 3H12V7H10.2C8.6 7 7.6 7.7 7 9Z"/></g>
<text x="595" y="25" text-anchor="middle" fill="#8a867c" style="font-size:13px">$ npx red-handed demo</text>
<rect class="l3" x="39.8" y="209" width="60.4" height="23" fill="#cc1a0a"/>
<text class="prompt" x="28" y="72" textLength="176.4" lengthAdjust="spacing" xml:space="preserve"><tspan fill="#ff6b57">$</tspan> npx red-handed demo</text>
<rect class="cover" x="44.8" y="56" width="159.6" height="22" fill="#141412"/>
<rect class="cursor" x="44.8" y="59" width="8.4" height="17" fill="#f3f0e8"/>
<text class="l0" x="28" y="116" textLength="982.8" lengthAdjust="spacing" xml:space="preserve"><tspan fill="#f3f0e8" fill-opacity=".55">A pretend agent was asked to fix a failing discount test. It reported "all tests pass". Here is what it actually did:</tspan></text>
<text class="l1" x="28" y="160" textLength="403.2" lengthAdjust="spacing" xml:space="preserve"><tspan fill="#f3f0e8" font-weight="700">red-handed</tspan><tspan fill="#f3f0e8">  agent/fix-discount vs main (6fcf81a)</tspan></text>
<text class="l2" x="28" y="182" textLength="420" lengthAdjust="spacing" xml:space="preserve"><tspan fill="#f3f0e8">            3 files, 1 test file, assertions +2 -2</tspan></text>
<text class="l3" x="28" y="226" textLength="210" lengthAdjust="spacing" xml:space="preserve"><tspan fill="#f3f0e8">  </tspan><tspan fill="#ffffff" font-weight="700">CAUGHT</tspan><tspan fill="#f3f0e8">   4 hard, 1 soft</tspan></text>
<text class="l4" x="28" y="270" textLength="352.8" lengthAdjust="spacing" xml:space="preserve"><tspan fill="#f3f0e8">  </tspan><tspan fill="#ff6b57"> </tspan><tspan fill="#f3f0e8"> test-command-neutered   package.json:1</tspan></text><path class="l4" d="M46.8 260l5.4 5.4m0 -5.4l-5.4 5.4" stroke="#ff6b57" stroke-width="1.8" stroke-linecap="round" fill="none"/>
<text class="l5" x="28" y="292" textLength="537.6" lengthAdjust="spacing" xml:space="preserve"><tspan fill="#f3f0e8">      </tspan><tspan fill="#7fd08a">+ {"name":"shop","scripts":{"test":"node --test || true"}}</tspan></text>
<text class="l6" x="28" y="314" textLength="730.8" lengthAdjust="spacing" xml:space="preserve"><tspan fill="#f3f0e8">      </tspan><tspan fill="#f3f0e8" fill-opacity=".55">The command that runs the tests was changed so failures no longer fail the build.</tspan></text>
<text class="l7" x="28" y="358" textLength="352.8" lengthAdjust="spacing" xml:space="preserve"><tspan fill="#f3f0e8">  </tspan><tspan fill="#ff6b57"> </tspan><tspan fill="#f3f0e8"> test-detection          src/cart.js:10</tspan></text><path class="l7" d="M46.8 348l5.4 5.4m0 -5.4l-5.4 5.4" stroke="#ff6b57" stroke-width="1.8" stroke-linecap="round" fill="none"/>
<text class="l8" x="28" y="380" textLength="705.6" lengthAdjust="spacing" xml:space="preserve"><tspan fill="#f3f0e8">      </tspan><tspan fill="#7fd08a">+ if (process.env.NODE_ENV === 'test') return subtotal(items) * percent / 100;</tspan></text>
<text class="l9" x="28" y="402" textLength="840" lengthAdjust="spacing" xml:space="preserve"><tspan fill="#f3f0e8">      </tspan><tspan fill="#f3f0e8" fill-opacity=".55">Production code now checks whether it is running under a test, which is how code fakes a pass.</tspan></text>
<text class="l10" x="28" y="446" textLength="403.2" lengthAdjust="spacing" xml:space="preserve"><tspan fill="#f3f0e8">  </tspan><tspan fill="#ff6b57"> </tspan><tspan fill="#f3f0e8"> assertion-weakened      test/cart.test.js:24</tspan></text><path class="l10" d="M46.8 436l5.4 5.4m0 -5.4l-5.4 5.4" stroke="#ff6b57" stroke-width="1.8" stroke-linecap="round" fill="none"/>
<text class="l11" x="28" y="468" textLength="806.4" lengthAdjust="spacing" xml:space="preserve"><tspan fill="#f3f0e8">      </tspan><tspan fill="#ff6b57">- assert.deepEqual(receipt(items, 'SAVE10'), { subtotal: 200, discount: 20, total: 180 });</tspan></text>
<text class="l12" x="28" y="490" textLength="369.6" lengthAdjust="spacing" xml:space="preserve"><tspan fill="#f3f0e8">      </tspan><tspan fill="#7fd08a">+ assert.ok(receipt(items, 'SAVE10'));</tspan></text>
<text class="l13" x="28" y="512" textLength="739.2" lengthAdjust="spacing" xml:space="preserve"><tspan fill="#f3f0e8">      </tspan><tspan fill="#f3f0e8" fill-opacity=".55">A precise assertion was swapped for a looser one that passes for almost any value.</tspan></text>
<text class="l14" x="28" y="556" textLength="403.2" lengthAdjust="spacing" xml:space="preserve"><tspan fill="#f3f0e8">  </tspan><tspan fill="#ff6b57"> </tspan><tspan fill="#f3f0e8"> test-skipped            test/cart.test.js:27</tspan></text><path class="l14" d="M46.8 546l5.4 5.4m0 -5.4l-5.4 5.4" stroke="#ff6b57" stroke-width="1.8" stroke-linecap="round" fill="none"/>
<text class="l15" x="28" y="578" textLength="478.8" lengthAdjust="spacing" xml:space="preserve"><tspan fill="#f3f0e8">      </tspan><tspan fill="#7fd08a">+ test.skip('HALF takes fifty percent off', () =&gt; {</tspan></text>
<text class="l16" x="28" y="600" textLength="394.8" lengthAdjust="spacing" xml:space="preserve"><tspan fill="#f3f0e8">      </tspan><tspan fill="#f3f0e8" fill-opacity=".55">A test was switched off instead of fixed.</tspan></text>
<text class="l17" x="28" y="644" textLength="403.2" lengthAdjust="spacing" xml:space="preserve"><tspan fill="#f3f0e8">  </tspan><tspan fill="#e8b64c">!</tspan><tspan fill="#f3f0e8"> expectation-edited      test/cart.test.js:12</tspan></text>
<text class="l18" x="28" y="666" textLength="420" lengthAdjust="spacing" xml:space="preserve"><tspan fill="#f3f0e8">      </tspan><tspan fill="#ff6b57">- assert.equal(total(items, 'SAVE10'), 180);</tspan></text>
<text class="l19" x="28" y="688" textLength="420" lengthAdjust="spacing" xml:space="preserve"><tspan fill="#f3f0e8">      </tspan><tspan fill="#7fd08a">+ assert.equal(total(items, 'SAVE10'), 190);</tspan></text>
<text class="l20" x="28" y="710" textLength="1142.4" lengthAdjust="spacing" xml:space="preserve"><tspan fill="#f3f0e8">      </tspan><tspan fill="#f3f0e8" fill-opacity=".55">The expected value in an assertion changed. Fine if the behavior was meant to change, a cheat if the test was bent to match a bug.</tspan></text>
<text class="l21" x="28" y="754" textLength="630" lengthAdjust="spacing" xml:space="preserve"><tspan fill="#f3f0e8" fill-opacity=".55">Now run npx red-handed in your own repo, or point it at a pull request URL.</tspan></text>
</svg>
