<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>red-handed og image</title>
<!-- Screenshot this at 1200x630 to make og.png. See scripts/serve-site.mjs for serving. -->
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@500;800;900&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; }
  body {
    background: #f3f0e8; color: #141414; position: relative;
    font-family: 'Inter Tight', 'Helvetica Neue', Arial, sans-serif;
    border-top: 14px solid #cc1a0a;
  }
  .mark { position: absolute; left: 64px; top: 44px; height: 40px; display: block; }
  h1 { position: absolute; left: 56px; top: 108px; margin: 0; font-size: 152px; line-height: 0.88; font-weight: 900; letter-spacing: -0.055em; word-spacing: 0.06em; }
  h1 span { color: #cc1a0a; display: block; }
  .slab { position: absolute; left: 64px; bottom: 54px; display: flex; align-items: baseline; gap: 20px; background: #cc1a0a; color: #fff; padding: 16px 26px 14px; transform: rotate(-2deg); transform-origin: left bottom; }
  .slab b { font-size: 76px; font-weight: 900; letter-spacing: -0.05em; line-height: 0.9; }
  .slab em { font-style: normal; font: 600 22px 'JetBrains Mono', monospace; }
  .cmd { position: absolute; right: 64px; bottom: 58px; border: 3px solid #141414; background: #fbfaf6; padding: 16px 24px; font: 600 28px 'JetBrains Mono', monospace; }
  .sub { position: absolute; right: 64px; top: 52px; font: 400 22px 'JetBrains Mono', monospace; color: #4f4d48; }
</style>
</head>
<body>
  <img class="mark" src="../brand/lockup.svg" alt="red-handed">
  <div class="sub">a CLI for AI agent diffs</div>
  <h1>All tests pass.<span>Sure they do.</span></h1>
  <div class="slab"><b>CAUGHT</b><em>4 hard, 1 soft</em></div>
  <div class="cmd">npx red-handed demo</div>
</body>
</html>
