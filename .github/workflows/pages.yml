name: pages
on:
  push:
    branches: [main]
    paths:
      - site/**
      - src/**
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node site/check.mjs
      # The page imports ./src/*.mjs, so the engine goes next to index.html.
      - name: Stage the site
        run: |
          mkdir _site
          cp -r site/. _site/
          cp -r src _site/src
          rm _site/check.mjs _site/og.html
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
